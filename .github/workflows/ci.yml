name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run the whole suite by hand against any ref, from the Actions tab.
  #
  # A pull request opened by a GitHub App does not create a workflow run: the
  # events an installation token generates are not allowed to trigger one, and
  # the result is a PR with no CI at all rather than a red one, which is the
  # harder thing to notice. This is the way back in. It needs write access to
  # invoke, it takes no inputs, and it runs exactly the jobs below, so it
  # widens who can start CI and not what CI can reach.
  #
  # GitHub only offers a workflow for dispatch once the trigger is on the
  # default branch, so this does nothing until it lands on main. After that it
  # covers every branch, including any this one cannot reach today.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Placeholders only. Real keys stay on the deployment; nothing here maps a
# repository secret into a job, so a workflow file cannot become a way to read
# one. The build job brings up its own Postgres beside it.
env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci
      # Prisma's client is generated, so `tsc` has nothing to check against
      # until it exists. It needs no database to be generated.
      - run: npx prisma generate
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - run: npx prisma generate
      # The database-backed tests skip themselves without a connection, which
      # is deliberate: the pure modules are the ones worth running on every
      # push, and they run in about eight seconds.
      - run: npm test

  invariants:
    name: Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci
      # This is the whole reason the suite will stay green. Upside Lab kept
      # one like it that nothing ran, and it drifted to twenty-three failures
      # behind a rename, a design pass and a navigation rework before anybody
      # counted. A check nothing runs reports on the code it was written
      # against, not the code you have. It takes about a second.
      - run: npm run test:invariants

  secrets:
    name: No credential in the client bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - run: npx prisma generate
      # Built with a key-shaped value in every server-only variable. If any of
      # them reaches the browser bundle, the grep below finds it. This is the
      # check CLAUDE.md has always said CI does; until now nothing did.
      #
      # ONE MARKER PER VARIABLE, because the failure has to name which leaked.
      # Every one of these was the same string, so the grep could only say that
      # *something* had; the marker carries the variable's own name now and the
      # failure prints it. The list is the whole server-only inventory rather
      # than the seven somebody remembered: `GROQ_API_KEY` and `GEMINI_API_KEY`
      # joined the provider chain and this did not follow them, `METRICS_TOKEN`
      # gates a route, and an error webhook's path is a common place to keep a
      # token. `scripts/test-invariants.ts` reads `PROVIDER_KEY_ENV` and checks
      # it against this list, so the next provider cannot be missed the same way.
      - name: Build with marked secrets
        env:
          CI_CANARY: canary-CI_CANARY-must-not-ship
          DATABASE_URL: postgresql://ci:canary-DATABASE_URL-must-not-ship@127.0.0.1:5432/ci
          DIRECT_URL: postgresql://ci:canary-DIRECT_URL-must-not-ship@127.0.0.1:5432/ci
          OPENROUTER_API_KEY: canary-OPENROUTER_API_KEY-must-not-ship
          ANTHROPIC_API_KEY: canary-ANTHROPIC_API_KEY-must-not-ship
          OPENAI_API_KEY: canary-OPENAI_API_KEY-must-not-ship
          GROQ_API_KEY: canary-GROQ_API_KEY-must-not-ship
          GEMINI_API_KEY: canary-GEMINI_API_KEY-must-not-ship
          EKILEX_API_KEY: canary-EKILEX_API_KEY-must-not-ship
          SUPABASE_SERVICE_ROLE_KEY: canary-SUPABASE_SERVICE_ROLE_KEY-must-not-ship
          METRICS_TOKEN: canary-METRICS_TOKEN-must-not-ship
          ERROR_WEBHOOK_URL: https://example.invalid/canary-ERROR_WEBHOOK_URL-must-not-ship
        run: npx next build
      - name: Grep the client bundle
        run: |
          if grep -rEho "canary-[A-Z_]+-must-not-ship" .next/static | sort -u > /tmp/leaked && [ -s /tmp/leaked ]; then
            echo "::error::A server-only value reached the client bundle: $(tr '\n' ' ' < /tmp/leaked)"
            exit 1
          fi
          echo "No server-only key in .next/static."
      # The same grep against the shapes a real key takes, in case one is
      # pasted into source rather than read from the environment.
      - name: Grep for key-shaped literals
        run: |
          if grep -rEl "sk-[A-Za-z0-9]{20,}|sk-ant-[A-Za-z0-9-]{20,}|sk-or-v1-[A-Za-z0-9]{20,}" .next/static; then
            echo "::error::Something key-shaped is in the client bundle."
            exit 1
          fi
          echo "Nothing key-shaped in .next/static."
      # The same sweep, widened: server chunks as well as static, AWS and Google
      # key shapes, a Postgres URL carrying a password, and — the one a grep for
      # "sk-" cannot see — a Supabase service_role JWT, told apart from the anon
      # key that is public by design by decoding the role claim.
      - name: Scan every built file for credential shapes
        run: npm run check:secrets

  build:
    name: Build against a real database
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        # Without this the job runs `prisma db push` before the server is
        # listening and fails on the connection rather than on anything it
        # was asked to check.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci
      # The real deploy command: generate, push the schema, seed the
      # dictionary if it is empty, then build. Running the whole thing here is
      # what catches a migration that cannot be applied or a seed that cannot
      # be loaded, which are the two ways a deploy fails after a green CI.
      - run: npm run build
      # The database-backed tests have a database now, so they no longer skip.
      - run: npm test
      # And the ones that only exist to check claims about the database:
      # replay idempotency, that a review outlives its card, that a restore in
      # replace mode leaves the log alone, and that deleting an account leaves
      # nothing of that person behind.
      - run: npm run test:db

  mobile:
    name: The browser suites
    runs-on: ubuntu-latest
    # Sixteen suites rather than eleven, and the five that were added are not
    # the cheap ones: the restore round trip exports and re-imports the whole
    # account. Measured at about seven and a half minutes of suites on top of
    # the install, the browser download, the build and the seed, so the ceiling
    # goes up rather than the list coming back down.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DEMO_OWNER_ID: local-single-user
      BASE_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # A shell loop rather than a `wait-on` dependency: this is the only
      # place anything would wait for a port, and it is four lines.
      - name: Start the server
        # A provider key has to be *present* or the scan page correctly offers
        # no camera. It may be nonsense: scripts/test-scan.mjs intercepts the
        # route it would authenticate, so no request ever leaves the runner.
        env:
          OPENROUTER_API_KEY: stubbed-by-the-test
        run: |
          npm start &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && exit 0
            sleep 1
          done
          echo "::error::The server never came up."
          exit 1
      # THE ONE SUITE THAT RUNS BEFORE THE FIXTURE, AND THE REASON THE FIXTURE
      # MOVED DOWN HERE.
      #
      # `/start` redirects anyone who has `onboardedAt` *or a single card*, on
      # the argument that a wizard reappearing for an established learner is
      # worse than no wizard. The fixture below gives this learner ninety-odd
      # cards, so with it in place first run correctly never opens, and the
      # nineteen checks that walk it were waived on every run this suite has
      # ever had: locally, and here. Sixteen of forty-two, honestly reported,
      # under the half that fails a suite outright, and permanent. The screen
      # a learner meets before any other was verified by nothing.
      #
      # So it goes first, against an empty deck, and the fixture is built
      # afterwards. It reaches 43 checks in that state rather than 26. What it
      # leaves behind is what any learner leaves behind: an onboarded flag, a
      # name, a placement row and a few units of cards, and `demo-data.ts`
      # clears the deck before rebuilding it.
      #
      # This ordering is load-bearing and `scripts/test-invariants.ts` asserts
      # it, because an ordering that matters and is only written in a comment
      # is an ordering that drifts. See the note above about `test-exam.mjs`
      # sitting in `test:browser` unrun for two builds.
      #
      # AND A SECOND SUITE WANTS THE SAME STATE, FIRST. Every screen in this
      # app has a branch for a learner with no cards and no history, and every
      # browser suite runs after the fixture, so that branch was rendered by
      # nothing: half of this app is a figure computed from a review log, and
      # on an empty one every panel takes a path nobody had looked at. It walks
      # every route the filesystem has, so a route added without an empty state
      # fails here rather than being found by a learner on their first evening.
      # It refuses to run against a deck with cards in it, because every check
      # would pass while testing the wrong app.
      - run: node scripts/test-first-day.mjs
      - run: node scripts/test-assess.mjs
      # A deck with something in it, so the review screen has cards and the
      # phone bar has a page under it to scroll.
      - run: npx tsx scripts/demo-data.ts
      # Every check here is a fault that was measured on a device: a menu
      # drawn off the top of the screen, a bar over the home indicator, a
      # backdrop filter repainting the bottom of the window on every frame of
      # every scroll, a target smaller than a thumb.
      # One server and one browser, so each of these costs a command rather
      # than a job. Every one declares a floor, so a suite that dies early or
      # quietly stops running a block fails here rather than printing nothing
      # and being read as a pass. See scripts/lib/checks.mjs.
      # The broadest walk first, so a route that stopped rendering says so
      # before fifteen narrower suites fail for the same reason. It is also the
      # only one that opens the navigation and asks whether every place in it
      # is actually reachable.
      - run: node scripts/smoke-new.mjs
      - run: node scripts/test-mobile.mjs
      # Text and icons inside their boxes, which is the fault none of the
      # page-shaped checks above can see: a word over a card's border, an icon
      # squeezed into an oval by the label beside it, a file picker 58px wider
      # than the card holding it. Then the same three questions with every run
      # of text swapped for one of the same length with nothing in it to break
      # on, because a row that fits today fits on the accident of where the
      # spaces in a gloss fell.
      - run: node scripts/test-containment.mjs
      - run: node scripts/test-design.mjs
      - run: node scripts/e2e.mjs
      - run: node scripts/test-modes.mjs
      - run: node scripts/test-teaching.mjs
      - run: node scripts/test-polish.mjs
      # Paper to deck, driven end to end with only the model stubbed: the
      # picture leaving the device, the confirmation list, a ticked word
      # becoming a card, and the review session asking about it.
      - run: node scripts/test-scan.mjs
      # The mock paper. This list is written out rather than deferring to
      # `npm run test:browser`, so a suite added to that script alone is a suite
      # CI never runs: `test-exam.mjs` sat here unrun for its first two builds,
      # floor and all, which is precisely the shape of failure `checks.mjs`
      # exists to make visible.
      - run: node scripts/test-exam.mjs
      # The loop that starts at a dead end and ends in the shared dictionary:
      # a report sent from a failed search, accepted in the review queue, and
      # read back on the entry. Every part of it is in a different process, so
      # nothing smaller than this can say the loop closes.
      - run: node scripts/test-suggestions.mjs
      - run: node scripts/a11y-check.mjs
      # And the five this list had quietly lost. The comment above about
      # `test-exam.mjs` sitting here unrun describes the drift in one
      # direction; these are the same drift in the other, and nothing was
      # counting. Every one of them was green when somebody finally ran them,
      # which is the least useful moment to find that out.
      #
      # `test-restore.mjs` is last on purpose: it exports the whole account,
      # wipes it and restores it, so anything after it would be looking at a
      # deck that had just been rebuilt. It is also the one this list could
      # least afford to be missing, since a backup that cannot be restored is
      # the only failure in this app with nothing to recover from.
      #
      # `smoke-new.mjs` was the fifth and two branches added it at once, which
      # a clean merge kept twice. It leads the list instead: it is the broadest
      # walk of the routes, so a page that stopped rendering says so before
      # fifteen narrower suites fail for the same reason.
      - run: node scripts/smoke-interact.mjs
      - run: node scripts/test-edit.mjs
      - run: node scripts/test-rename.mjs
      # CLAUDE.md calls this the one worth keeping green above all, and until
      # now nothing ran it. It was red on main for an unknown length of time
      # with a real fault behind it: the page cache is filled as a side effect
      # of the worker serving a navigation, and the worker never serves the
      # navigation that installs it, so a first visit had nothing to fall back
      # on. A suite nobody runs cannot tell you that.
      - run: node scripts/smoke-offline.mjs
      # The error state, which is the one of the four that nothing ever put on a
      # screen. It starts its own server on a spare port against a database that
      # is not there, so it needs the build but not this job's database, and it
      # leaves the one on 3000 alone. Before `test-restore.mjs` because that one
      # wipes and rebuilds the account and anything after it reads a fresh deck.
      - run: node scripts/test-error.mjs
      - run: node scripts/test-restore.mjs

  signin:
    name: The sign-in screen
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # ITS OWN JOB, AND THAT IS ABOUT TIME RATHER THAN TIDINESS.
    #
    # `scripts/test-signin.mjs` needs a build of its own, because whether this
    # app gates every route or runs as one local learner is decided when the
    # bundle is built: `NEXT_PUBLIC_` variables are inlined, so a server told
    # to forget them still gates every route. Every other browser suite runs
    # against a local-mode build, which is why the hosted sign-in screen had
    # no coverage at all.
    #
    # It first ran as one more step inside "The browser suites", which was
    # already the longest job at about fifteen minutes. Adding a full
    # `next build` to the end of it, on a runner that is simultaneously
    # serving the app and driving Chromium, took that job past its
    # thirty-minute ceiling. A job permanently at its limit is an
    # intermittent red for everybody, and the fix is not a bigger number.
    #
    # Here the build runs beside the other jobs rather than after fifteen
    # minutes of suites, so the wall clock of CI does not move.

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The schema and the dictionary, but not a build: the suite makes its
      # own, in hosted mode and into its own distDir, which is the whole
      # reason it is a separate job.
      - run: npx prisma generate
      - run: npx prisma db push
      - run: npm run db:seed:ensure
      - run: node scripts/test-signin.mjs

  load:
    name: The derived queries, at a size somebody reaches
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - run: npm run build
      # Progress is derived from the whole review log on every request
      # (ADR-014), so the only honest place to measure it is a log the size one
      # actually becomes. The demo deck is 417 reviews and would report a
      # missing index as fast.
      - name: Write a year of history for forty learners
        run: npx tsx scripts/load-fixture.ts --learners 40 --reviews 5000
      # Budgets, not records: this fails when a query goes over, and the number
      # to fix is the query rather than the budget. See docs/15-performance.md.
      #
      # Through `tsx`, which is what `npm run test:load` has always used and
      # what this step needs: the script imports the progress functions
      # themselves, and those import each other through the `@/lib` alias,
      # which plain `node` cannot resolve. It threw on the first import,
      # before check one.
      - run: npm run test:load -- --budget-only

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci
      # Read every advisory in the whole tree, out loud, whether or not it
      # blocks. This step never fails: it is the record.
      - name: Every advisory, dev included
        run: npm audit || true
      # THE GATE IS `high`, AND IT GOT THERE BY THE CHAIN BEING CLEARED
      # RATHER THAN BY THE BAR BEING MOVED.
      #
      # It was `high` on the first run of this workflow and failed, on five
      # advisories, and stopped at `critical` with the argument that no change
      # in this repository could clear them and that a blocking check which
      # cannot pass is the one people learn to click past. The first half of
      # that was wrong, and the note said so itself by naming the fix as
      # next@16: both chains are resolved by `overrides` in package.json, and
      # neither needs a major upgrade.
      #
      #   postcss. Every other consumer in the tree was already on the patched
      #   8.5.26 and only Next's own pin held 8.4.31, so one override deduped
      #   it onto what was already installed. The proof it changed nothing is
      #   the build output: Next names a stylesheet by the hash of its
      #   contents, and it is the same file, 313a9df4d86383e6.css, to the byte.
      #
      #   deepmerge-ts, reached through @prisma/config. Overridden to 8.0.2,
      #   and `prisma generate`, `prisma db push` and the seed all run.
      #
      # `npm audit --omit=dev` reports zero. Dev-only advisories used to be
      # read by the step above and left to it, because they do not ship.
      #
      # THEY NOW BLOCK TOO, AND AGAIN BY THE CHAIN BEING CLEARED RATHER THAN
      # THE BAR BEING MOVED. There were five, up to critical, all of them in
      # the vitest -> vite -> esbuild chain: a dev server that accepts requests
      # from any website, a path traversal, an fs.deny bypass. None of it ships
      # and "0 vulnerabilities" was true of the built app, which is exactly why
      # it was worth saying out loud that it was not true of a contributor's
      # machine while `npm run dev` or a watch run was up. A minor upgrade to
      # vitest 3 cleared all five, with the whole unit and integration suite
      # green on it and no change to a single test.
      #
      # Two gates rather than one, on purpose: the first is the promise about
      # what is deployed and must never be relaxed, the second is the promise
      # about what a contributor runs. If either cannot pass, fix the
      # dependency or say here, in writing, why it is unreachable. Do not lower
      # a number.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high

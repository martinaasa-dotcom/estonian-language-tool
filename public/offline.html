<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Kodukeel</title>
<!--
  Served by the service worker when a navigation cannot reach the network and
  there is no cached copy of the page. It is deliberately self-contained: no
  fonts, no scripts, no stylesheet requests, because every one of those would be
  a request that cannot succeed.
-->
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: system-ui, -apple-system, sans-serif;
    background: #faf9f7; color: #1c1a17; padding: 1.5rem;
  }
  main { max-width: 30rem; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { line-height: 1.6; color: #54504a; margin: 0 0 1rem; }
  a {
    display: inline-block; margin-top: .5rem; padding: .55rem 1.1rem;
    border-radius: .375rem; background: #3E6BA8; color: #fff; text-decoration: none;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #161513; color: #f2efea; }
    p { color: #a8a29a; }
  }
</style>
</head>
<body>
  <main>
    <p lang="et" style="font-size:2rem;margin:0 0 .5rem">Võrguühenduseta</p>
    <h1>You are offline</h1>
    <p>
      Review works without a connection once you have opened it at least once — your grades
      are saved on this device and sent when you are back.
    </p>
    <p>The dictionary and Anu need the network, so those will wait.</p>
    <a href="/review">Try review</a>
  </main>
</body>
</html>
